[package]
name = "icqe2e_core"
version = "0.2.0"
edition = "2021"
description = "Shared engine for the ICQ E2E add-on: FLAP/SNAC/ICBM parsing, the Phase 1 rewrite harness and Winsock hooking"
license = "MIT"
publish = false

[lib]
# A plain library, linked into each loader stub, so one codebase ships in both
# tbdiag.dll and msimg32.dll.
name = "icqe2e_core"
crate-type = ["lib"]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinHttp",
] }
vodozemac = { version = "0.11.1", default-features = false, features = ["libolm-compat"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.6"
ring = "0.17"

[dev-dependencies]
ctor = "1.0.13"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
