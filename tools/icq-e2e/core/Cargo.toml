[package]
name = "icqe2e_core"
version = "0.1.0"
edition = "2021"
description = "Shared engine for the ICQ E2E add-on: FLAP/SNAC/ICBM parsing and Winsock hooking (observation only)"
license = "MIT"
publish = false

[lib]
# A plain library, linked into each loader stub, so one codebase ships in both
# tbdiag.dll and msimg32.dll.
name = "icqe2e_core"
crate-type = ["lib"]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }
