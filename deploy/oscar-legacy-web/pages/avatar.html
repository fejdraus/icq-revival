<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{picTitle}}</title>

<!-- A template, filled in by avatarPage() in server.js: the double-brace
     markers are texts from its dictionary, the frame every page shares, and
     the messages the script below shows. -->

<!-- The Xtraz plugin object, the way back into the client. The interface is
     MISBDhtmlXtraWrapper, described in the type library inside MISB.dll; this
     class id is the one the original ICQ.com packages used. -->
<OBJECT CLASSID="clsid:8D18DFF4-0943-4347-8BCA-0C57033F6820" id="plugin" width="0" height="0">
  OBJECT NOT SET
</OBJECT>

<style>{{STYLE}}
/* 52x64 is the size the client stores, drawn here at the 85x106 of its profile
   window - the same stretch, so the preview is honest about how sharp the
   picture will actually look. */
.shot { width: 85px; height: 106px; border: 1px solid #cfe3d5; background: #fbfdfb; }
.shotcell { width: 96px; }
/* The two tabs: the same pills as the language switch. */
.tabs { margin: 0 0 8px; }
.tabs a {
  display: inline-block; padding: 2px 11px; margin-right: 5px;
  font-size: 13px; text-decoration: none; color: #1a1a1a;
  border: 1px solid #9a9a9a; border-radius: 9px; background: #f2f0ea;
}
.tabs a.on { color: #fff; background: #3c6e1f; border-color: #35601a; }
/* The animated faces: a table of thumbnails at the size the client stores. */
table.gallery { width: 100%; }
td.anim { width: 16%; padding: 4px 2px 6px; font-size: 12px; line-height: 1.25; }
td.anim a { text-decoration: none; color: #1a1a1a; }
td.anim img.thumb { border: 2px solid #e6e2d9; background: #fff; }
td.anim.on img.thumb { border-color: #3c6e1f; }
td.anim.on a { font-weight: bold; }
.thumbcell { width: 64px; }
/* The groups of avatars, switched like the tabs: the client's window has no
   scroll bar, and each group fits it on its own. */
.grptabs a { font-size: 12px; padding: 1px 9px; }
</style>
</head>
<body class="compact">
<main class="window">
  {{HEADER}}
  <div class="body">
    <div class="tabs" style="{{TABS_STYLE}}">
      <a href="#" id="tabPicture" class="on" onclick="tab('picture'); return false;">{{picTabPicture}}</a><a
         href="#" id="tabAnimated" onclick="tab('animated'); return false;">{{picTabAnimated}}</a>
    </div>

    <div id="pagePicture">
    <p>{{picLead}}</p>

    <div class="panel">
      <table cellpadding="0" cellspacing="0" border="0"><tr>
        <td class="shotcell" valign="middle"><img id="current" class="shot" src="" alt=""></td>
        <td valign="middle"><b>{{picCurrent}}</b><br><span class="dim">{{picCurrentNote}}</span></td>
      </tr></table>
    </div>

    <form id="form" method="post" enctype="multipart/form-data"
          action="/icq/avatar/upload?lang={{LANG}}" target="sink">
      <div class="soft"><input type="file" id="file" name="picture" onchange="chosen()"></div>
    </form>

    <div class="soft" id="previewRow" style="display:none">
      <table cellpadding="0" cellspacing="0" border="0"><tr>
        <td class="shotcell" valign="middle"><img id="preview" class="shot" src="" alt=""></td>
        <td valign="middle"><b>{{picPreview}}</b><br><span class="dim" id="previewNote"></span></td>
      </tr></table>
      <div class="actions">
        <button type="button" class="primary" onclick="apply()">{{picUpload}}</button>
        <button type="button" onclick="cancel()">{{picCancel}}</button>
      </div>
    </div>

    <div class="hint" id="status"></div>
    </div>

    <div id="pageAnimated" style="display:none">
      <p>{{picAnimLead}}</p>

      <!-- The same frame as the picture tab's: what is set now, as contacts
           see it. -->
      <div class="panel" id="animNowRow">
        <table cellpadding="0" cellspacing="0" border="0"><tr>
          <td class="shotcell" valign="middle"><img id="animCurrent" class="shot" src="" alt=""></td>
          <td valign="middle"><b>{{picAnimNow}} <span id="animNow">{{picAnimNone}}</span></b><br><span class="dim">{{picCurrentNote}}</span></td>
        </tr></table>
      </div>

      <div class="soft" id="animRow" style="display:none">
        <table cellpadding="0" cellspacing="0" border="0"><tr>
          <td class="thumbcell" valign="middle"><img id="animPreview" src="" width="52" height="64" alt=""></td>
          <td valign="middle">{{picAnimChosen}} <b id="animTitle"></b></td>
        </tr></table>
        <div class="actions">
          <button type="button" class="primary" onclick="applyAnimated()">{{picAnimSet}}</button>
          <button type="button" onclick="cancelAnimated()">{{picCancel}}</button>
        </div>
      </div>
      <div class="hint" id="animStatus"></div>

      <div id="animList">
      {{ANIMATED}}
      <p><span class="dim">{{picAnimNote}}</span></p>
      </div>
    </div>
  </div>
  {{FOOTER}}
</main>

<iframe name="sink" id="sink" style="display:none" src="about:blank" onload="sinkLoaded()"></iframe>

<script type="text/javascript">
// The messages, in the language the page was opened in.
var T = {{STRINGS}};

// The animated faces this server has ({file, title}), and the plain HTTP
// address they are served from.
var AVATARS = {{AVATARS}};
var AVATAR_BASE = {{AVATAR_BASE}};

// The picture is a BART item; the type library lists the kinds as
// sbICQDevi1z = 1 and sbICQExtras = 8. ICQ 6 calls this picture a "devil".
// The animated face is the other one: an address the client wraps in
// <DOCUMENT><RESSET TYPE="ICQ_EXTRAS"><URL>...</URL></RESSET></DOCUMENT> and
// uploads as BART type 8.
var BART_PICTURE = 1;
var BART_ANIMATED = 8;
var transaction = 0;
var pending = '';
var waiting = false;
// The transactions of the animated tab, so their answers are not taken for
// the picture's.
var animRead = -1;
var animSet = -1;
// The transaction that reads the current picture: its failure only means
// there is none (an animated face may stand in its place), not a refusal.
var picRead = -1;
var animPending = '';
var animChosen = '';
// The still picture set after the movie (see setStill()): its transaction,
// and its address while the answer is awaited.
var stillSet = -1;
var stillPending = '';
// Whether the still has been asked for yet: until then no picture event is
// its answer.
var stillAsked = false;
// The avatar the movie just set belongs to, so its still follows it.
var animStill = '';

// Both tabs have a status line; only the visible one is seen.
function say(text) {
  document.getElementById('status').innerHTML = text;
  document.getElementById('animStatus').innerHTML = text;
}

function tab(which) {
  var animated = which === 'animated';
  document.getElementById('pagePicture').style.display = animated ? 'none' : '';
  document.getElementById('pageAnimated').style.display = animated ? '' : 'none';
  document.getElementById('tabPicture').className = animated ? '' : 'on';
  document.getElementById('tabAnimated').className = animated ? 'on' : '';
}

// Shows one group of avatars, ICQ's own or the ones users made.
function group(which) {
  var names = ['icq', 'user'];
  for (var i = 0; i < names.length; i++) {
    var body = document.getElementById('grp-' + names[i]);
    var link = document.getElementById('grpTab-' + names[i]);
    if (body) { body.style.display = names[i] === which ? '' : 'none'; }
    if (link) { link.className = names[i] === which ? 'on' : ''; }
  }
}

// The plugin object stays inert until it is handed the instance id that the
// client puts in the address of the page it opens.
function connect() {
  if (AVATARS.length && /[?&]tab=animated/.test(window.location.search)) { tab('animated'); }
  var m = /[?&]id=([^&]*)/.exec(window.location.search);
  if (!m) { say(T.picOnlyInIcq); return; }
  try {
    plugin.Initialize(m[1]);
  } catch (e) {
    say(T.picNoClient + e.message);
    return;
  }
  refresh();
  if (AVATARS.length) { readAnimated(); }
}

// The page cannot read the file itself - this window blocks every way of doing
// that - so the preview is made by sending the file to the server, which fits
// it to the client's frame, scales it down and hands back an address to show.
// Nothing reaches the client at this point: that is what the button is for.
function chosen() {
  if (!document.getElementById('file').value) { return; }
  say(T.picPreparing);
  waiting = true;
  try {
    document.getElementById('form').submit();
  } catch (e) {
    waiting = false;
    say(T.picSendFailed + e.message);
  }
}

// The hidden frame the form posts into has loaded. Our own answer calls
// uploaded() first; if nothing did, what came back was not ours - an error
// page from the proxy in front, for a file over its limit - and the page would
// otherwise sit at "Preparing the preview..." for ever.
function sinkLoaded() {
  setTimeout(function () {
    if (!waiting) { return; }
    waiting = false;
    clearPick();
    say(T.picNoAnswer);
  }, 100);
}

// The file control only reports a change, so picking the same file twice in a
// row would go unnoticed. Emptying the form after every attempt keeps the next
// pick - the same file or another - working.
function clearPick() {
  try { document.getElementById('form').reset(); } catch (e) {}
}

function uploaded(result) {
  waiting = false;
  clearPick();
  if (result.error) { say(T.picPrepareFailed + result.error); return; }
  // The preview comes over the page's own scheme; the client gets a plain
  // HTTP address, since its picture loader cannot do HTTPS.
  pending = result.clientUrl || result.url;
  document.getElementById('preview').src = result.url;
  document.getElementById('previewRow').style.display = '';
  document.getElementById('previewNote').innerHTML = result.note || T.picReady;
  say('');
}

// The client is not given the image itself: SetBartItem takes an address, and
// ICQ fetches it and uploads it to the server under our name.
function apply() {
  if (!pending) { return; }
  transaction = transaction + 1;
  var sent = pending;
  // Said before the call, never after it: the client fires its "done" events
  // synchronously, from inside SetBartItem, so by the time the call returns
  // done() may already have said "Saved" - and writing "Uploading..." then
  // left the page stuck on it.
  say(T.picUploading);
  try {
    plugin.SetBartItem(transaction, BART_PICTURE, sent);
  } catch (e) {
    say(T.picRefused + e.message);
    return;
  }
  // A net for the case no event comes at all.
  setTimeout(function () {
    if (pending === sent) { cancel(); say(T.picDone); }
  }, 6000);
}

function cancel() {
  pending = '';
  document.getElementById('previewRow').style.display = 'none';
  clearPick();
  say('');
}

function refresh() {
  transaction = transaction + 1;
  picRead = transaction;
  try {
    plugin.GetBartItem(transaction, BART_PICTURE, plugin.OwnerInfo.ScreenName);
  } catch (e) {
    say(T.picReadFailed + e.message);
  }
}

// Ends an upload however the news of it arrives, and never leaves the page
// saying "Uploading..." for ever.
function done() {
  if (!pending) { return; }
  cancel();
  say(T.picSaved);
}

function show(source) {
  if (!source) { return; }
  document.getElementById('current').src = source;
}

// ------------------------------------------------------------ animated faces

function findAvatar(file) {
  for (var i = 0; i < AVATARS.length; i++) {
    if (AVATARS[i].file.toLowerCase() === String(file).toLowerCase()) { return AVATARS[i]; }
  }
  return null;
}

function cellOf(file) {
  return document.getElementById('av-' + String(file).replace(/\.[a-z]+$/i, ''));
}

// A thumbnail was clicked: it becomes the one the button sets. Nothing
// reaches the client yet.
function choose(file) {
  var a = findAvatar(file);
  if (!a) { return; }
  if (animChosen && cellOf(animChosen)) { cellOf(animChosen).className = 'anim'; }
  animChosen = a.file;
  if (cellOf(a.file)) { cellOf(a.file).className = 'anim on'; }
  var img = cellOf(a.file) ? cellOf(a.file).getElementsByTagName('img')[0] : null;
  document.getElementById('animPreview').src = img ? img.src : '';
  document.getElementById('animTitle').innerHTML = '';
  document.getElementById('animTitle').appendChild(document.createTextNode(a.title));
  document.getElementById('animRow').style.display = '';
  say('');
}

function cancelAnimated() {
  if (animChosen && cellOf(animChosen)) { cellOf(animChosen).className = 'anim'; }
  animChosen = '';
  document.getElementById('animRow').style.display = 'none';
  say('');
}

// The same call as the picture, with the other kind: the client is handed
// the movie's address, uploads that address to the server as the owner's
// BART type 8, and every contact's client fetches the movie from it.
function applyAnimated() {
  if (!animChosen || animPending || stillPending) { return; }
  var chosen = findAvatar(animChosen);
  animStill = chosen && chosen.still ? chosen.still : '';
  transaction = transaction + 1;
  animSet = transaction;
  var sent = AVATAR_BASE + animChosen;
  animPending = sent;
  // Said before the call: the events may fire from inside it (see apply()).
  say(T.picAnimSetting);
  try {
    plugin.SetBartItem(transaction, BART_ANIMATED, sent);
  } catch (e) {
    animPending = '';
    say(T.picAnimRefused + e.message);
    return;
  }
  setTimeout(function () {
    if (animPending === sent) { animDone(sent); }
  }, 6000);
}

function animDone(data) {
  if (!animPending) { return; }
  var sent = animPending;
  animPending = '';
  cancelAnimated();
  showAnimated(data || sent);
  if (!animStill) { say(T.picAnimSaved); return; }
  // The movie is in place; its still picture follows. Not from in here:
  // this runs inside the client's own event, and may be inside the
  // SetBartItem call that set the movie (see apply()).
  say(T.picAnimStill);
  stillPending = AVATAR_BASE + animStill;
  stillAsked = false;
  animStill = '';
  setTimeout(setStill, 300);
}

// The still picture of the same face, as the buddy picture (BART type 1),
// the same way the picture tab sets an uploaded one: an address the client
// fetches and uploads itself. ICQ 6 plays the movie; Miranda, ICQ 2003b, AIM
// and the like cannot, and show this instead. It is set after the movie and
// never alongside it, so the two answers cannot be taken for each other.
function setStill() {
  if (!stillPending) { return; }
  var sent = stillPending;
  transaction = transaction + 1;
  stillSet = transaction;
  stillAsked = true;
  try {
    plugin.SetBartItem(transaction, BART_PICTURE, sent);
  } catch (e) {
    stillPending = '';
    say(T.picAnimStillRefused);
    return;
  }
  setTimeout(function () {
    if (stillPending === sent) { stillDone(); }
  }, 6000);
}

function stillDone() {
  if (!stillPending || !stillAsked) { return; }
  stillPending = '';
  say(T.picAnimSaved);
}

function stillFailed() {
  if (!stillPending || !stillAsked) { return; }
  stillPending = '';
  say(T.picAnimStillRefused);
}

function readAnimated() {
  transaction = transaction + 1;
  animRead = transaction;
  try {
    plugin.GetBartItem(transaction, BART_ANIMATED, plugin.OwnerInfo.ScreenName);
  } catch (e) {
    // Only the "now set" line depends on it.
  }
}

// What the client reports for the animated face: our address, or the XML it
// wraps it in. One of ours is named; anything else is said to be from
// elsewhere.
function showAnimated(data) {
  var text = T.picAnimNone;
  var a = null;
  if (data) {
    var m = /\/icq\/avatars\/([A-Za-z0-9_-]+\.swf)/.exec(String(data));
    a = m ? findAvatar(m[1]) : null;
    text = a ? a.title : T.picAnimOther;
  }
  var now = document.getElementById('animNow');
  now.innerHTML = '';
  now.appendChild(document.createTextNode(text));
  // The same preview the picture tab has: the avatar's thumbnail, or an
  // empty frame when none of ours is set.
  var shot = document.getElementById('animCurrent');
  if (a && a.thumb) { shot.src = '/icq/avatars/' + a.thumb; }
  else { shot.removeAttribute('src'); }
}
</script>

<script for="plugin" event="OnBartOpSucceeded(transID, bcstrData)" language="JavaScript">
  if (transID == animRead) { showAnimated(bcstrData); }
  else if (transID == animSet) { animDone(bcstrData); }
  else if (transID == stillSet) {
    show(bcstrData);
    stillDone();
  }
  else {
    show(bcstrData);
    done();
  }
</script>

<script for="plugin" event="OnBartOpFailed(transID)" language="JavaScript">
  if (transID == animRead) { showAnimated(''); }
  else if (transID == animSet) { animPending = ''; animStill = ''; say(T.picAnimServerRefused); }
  else if (transID == stillSet) { stillFailed(); }
  // Reading fails when there is simply no picture, which is not worth a fuss;
  // only an upload that was asked for is reported as refused.
  else if (transID != picRead && pending) { say(T.picServerRefused); }
</script>

<script for="plugin" event="OnOwnerBartItemChange(eType, bcstrData)" language="JavaScript">
  // The one event the client always sends once the picture is in place. The
  // acknowledgement of the upload itself does not always arrive, so the status
  // is finished here rather than there. eType is the BART kind, so the
  // animated face does not end up in the picture's frame. The still an
  // animated avatar brings along is a picture like any other.
  if (eType == BART_ANIMATED) {
    showAnimated(bcstrData);
    animDone(bcstrData);
  } else {
    show(bcstrData);
    if (stillPending && stillAsked) { stillDone(); } else { done(); }
  }
</script>

<!-- Connected last, once the handlers above are in place. -->
<script type="text/javascript">setTimeout(connect, 0);</script>

</body>
</html>
