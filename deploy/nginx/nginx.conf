### TLS front end for 2000s-era clients (nginx + OpenSSL 1.0.2u).
#
# Modern OpenSSL does not understand the AIM 6.2-7.x hello: it arrives in
# SSLv2 format ("v2 hello"), and parsing of that was dropped as of 1.1.0.
# Hence nginx here, linked against the old library.
#
# The container runs in the host network, so the server is reachable as
# 127.0.0.1.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # The conditional headers show whether a client asks "changed since?"
    # (ICQ 6.5's Xtraz list, answered with a 304 while it has not changed).
    log_format legacy '$remote_addr -> $upstream_addr "$request" $status '
                      'ssl=$ssl_protocol/$ssl_cipher '
                      'ims="$http_if_modified_since" inm="$http_if_none_match"';
    access_log /dev/stdout legacy;
    error_log  /dev/stdout info;

    # The suites that clients of those years knew.
    ssl_protocols             SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers               ALL:!aNULL;
    ssl_prefer_server_ciphers off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.pem;
    ssl_dhparam               /etc/nginx/dhparam.pem;

    ssl_session_cache         shared:HTTPSSL:10m;
    ssl_session_timeout       5m;
    ssl_session_tickets       off;

    proxy_http_version        1.1;
    proxy_set_header          Host $http_host;
    proxy_set_header          X-Real-IP $remote_addr;
    proxy_connect_timeout     10s;
    proxy_read_timeout        120s;
    proxy_send_timeout        120s;

    # The last good Xtraz list of ICQ 6.5, for when oscar-legacy-web is being
    # restarted. The client reads the list every six hours and treats a failed
    # read as a list without the picture entry until the next one, sending
    # "choose a picture" to an error page meanwhile.
    # The admin panel (/admin/ on 443, conf.d/register.conf) is one password
    # over every account: a few requests a second per address at most, so
    # guessing it is slow.
    limit_req_zone            $binary_remote_addr zone=admin:1m rate=2r/s;

    proxy_cache_path          /var/cache/nginx/xtraz keys_zone=xtraz:1m
                              max_size=10m inactive=30d use_temp_path=off;

    # Kerberos (UAS): what AIM 6.2-7.5 sign in through
    server {
        listen 1443 ssl;
        location / {
            proxy_pass http://127.0.0.1:1088;
        }
    }

    # WebAPI: clientLogin and startOSCARSession
    server {
        listen 8443 ssl;
        location / {
            proxy_pass http://127.0.0.1:8082;
        }
    }

    # Stand-ins for the dead ICQ web services (oscar-legacy-web).
    #
    # It has to be HTTPS: browsers upgrade http:// to https:// on their own
    # ("Always use secure connections"), and plain HTTP ends up as
    # ERR_SSL_PROTOCOL_ERROR. The certificate here is a real one, from
    # Let's Encrypt via Tailscale, not our internal CA for AIM.
    server {
        listen 8102 ssl;
        ssl_certificate     /etc/nginx/certs/ts-cert.pem;
        ssl_certificate_key /etc/nginx/certs/ts-key.pem;
        ssl_protocols       TLSv1.2;

        # The picture page uploads photographs straight from a phone; the
        # service takes up to 16 MB and scales them down itself. nginx would
        # otherwise stop anything over its default of 1 MB.
        client_max_body_size 16m;

        # ICQ 6.5's Xtraz list: served stale while the service is down.
        location ~ ^/xtraz2/.*xtrazlist\.xml$ {
            proxy_pass http://127.0.0.1:8101;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache            xtraz;
            proxy_cache_key        $http_host$uri;
            proxy_ignore_headers   Cache-Control Expires;
            proxy_cache_valid      200 1m;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
            # The client's If-Modified-Since is the time it saved its copy,
            # not our Last-Modified: a 304 for any copy saved since the change.
            if_modified_since      before;
        }

        location / {
            proxy_pass http://127.0.0.1:8101;
            # Any proxy_set_header here stops the ones from the http block from
            # being inherited, so Host and X-Real-IP are repeated. The pages
            # build their own links from Host and the scheme.
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Sites that differ between installations. The container deployment puts
    # the HTTPS front of the registration pages here (deploy/nginx/conf.d);
    # a host where something else serves those pages leaves the folder empty,
    # and a pattern that matches nothing is not an error.
    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format proxy '$remote_addr -> $upstream_addr ssl=$ssl_protocol/$ssl_cipher '
                     'sent=$bytes_sent recv=$bytes_received dur=$session_time';
    access_log /dev/stdout proxy;

    ssl_protocols             SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers               ALL:!aNULL;
    ssl_prefer_server_ciphers off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.pem;
    ssl_dhparam               /etc/nginx/dhparam.pem;

    ssl_session_cache         shared:STREAMSSL:10m;
    ssl_session_timeout       5m;
    ssl_session_tickets       off;

    proxy_connect_timeout     10s;
    proxy_half_close          off;
    # clients send a FLAP keep-alive every couple of minutes
    proxy_timeout             10m;
    # The server must see the client's real address, not 127.0.0.1: it hands
    # that address to the other side of a direct connection (file transfer)
    # and uses it to recognise clients on the same network. The server reads
    # the PROXY v1 header only from loopback (server/oscar/proxy_protocol.go).
    proxy_protocol            on;

    # OSCAR over TLS: the historical slogin.icq.com port.
    # Our own RSA certificate lives here: that is the one AIM's NSS database
    # knows, while the 2011 libraries do not understand the Tailscale (ECDSA)
    # certificate.
    server {
        listen     3143 ssl;
        proxy_pass 127.0.0.1:5191;
    }

    # The same OSCAR for modern clients (Miranda NG and the like): the
    # Tailscale certificate from Let's Encrypt, which verifies out of the box
    # without installing anything into the system store.
    server {
        listen                5193 ssl;
        ssl_certificate       /etc/nginx/certs/ts-cert.pem;
        ssl_certificate_key   /etc/nginx/certs/ts-key.pem;
        proxy_pass            127.0.0.1:5191;
    }
}
