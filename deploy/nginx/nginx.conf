### TLS-фронт для клиентов 2000-х (nginx + OpenSSL 1.0.2u).
#
# Современный OpenSSL не понимает приветствие AIM 6.2-7.x: оно приходит в
# формате SSLv2 ("v2 hello"), разбор которого выкинули начиная с 1.1.0.
# Поэтому здесь nginx, слинкованный со старой библиотекой.
#
# Контейнер работает в сети хоста, поэтому сервер доступен как 127.0.0.1.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format legacy '$remote_addr -> $upstream_addr "$request" $status '
                      'ssl=$ssl_protocol/$ssl_cipher';
    access_log /dev/stdout legacy;
    error_log  /dev/stdout info;

    # Наборы, которые знали клиенты тех лет.
    ssl_protocols             SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers               ALL:!aNULL;
    ssl_prefer_server_ciphers off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.pem;
    ssl_dhparam               /etc/nginx/dhparam.pem;

    ssl_session_cache         shared:HTTPSSL:10m;
    ssl_session_timeout       5m;
    ssl_session_tickets       off;

    proxy_http_version        1.1;
    proxy_set_header          Host $http_host;
    proxy_set_header          X-Real-IP $remote_addr;
    proxy_connect_timeout     10s;
    proxy_read_timeout        120s;
    proxy_send_timeout        120s;

    # Kerberos (UAS) — то, через что авторизуются AIM 6.2-7.5
    server {
        listen 1443 ssl;
        location / {
            proxy_pass http://127.0.0.1:1088;
        }
    }

    # WebAPI — clientLogin и startOSCARSession
    server {
        listen 8443 ssl;
        location / {
            proxy_pass http://127.0.0.1:8082;
        }
    }

    # Подмена мёртвых веб-служб ICQ (oscar-legacy-web).
    #
    # Нужен именно HTTPS: браузеры поднимают http:// до https:// сами
    # («Всегда использовать безопасное соединение»), и открытый HTTP
    # оборачивается ERR_SSL_PROTOCOL_ERROR. Сертификат здесь настоящий,
    # от Let's Encrypt через Tailscale, а не наш внутренний CA для AIM.
    server {
        listen 8102 ssl;
        ssl_certificate     /etc/nginx/certs/ts-cert.pem;
        ssl_certificate_key /etc/nginx/certs/ts-key.pem;
        ssl_protocols       TLSv1.2;

        location / {
            proxy_pass http://127.0.0.1:8101;
            # Any proxy_set_header here stops the ones from the http block from
            # being inherited, so Host and X-Real-IP are repeated. The pages
            # build their own links from Host and the scheme.
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Sites that differ between installations. The container deployment puts
    # the HTTPS front of the registration pages here (deploy/nginx/conf.d);
    # a host where something else serves those pages leaves the folder empty,
    # and a pattern that matches nothing is not an error.
    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format proxy '$remote_addr -> $upstream_addr ssl=$ssl_protocol/$ssl_cipher '
                     'sent=$bytes_sent recv=$bytes_received dur=$session_time';
    access_log /dev/stdout proxy;

    ssl_protocols             SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers               ALL:!aNULL;
    ssl_prefer_server_ciphers off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.pem;
    ssl_dhparam               /etc/nginx/dhparam.pem;

    ssl_session_cache         shared:STREAMSSL:10m;
    ssl_session_timeout       5m;
    ssl_session_tickets       off;

    proxy_connect_timeout     10s;
    proxy_half_close          off;
    # клиенты шлют FLAP keep-alive раз в пару минут
    proxy_timeout             10m;

    # OSCAR поверх TLS: исторический порт slogin.icq.com.
    # Здесь лежит наш собственный RSA-сертификат — именно его знает база NSS
    # у AIM, а сертификат Tailscale (ECDSA) библиотеки 2011 года не понимают.
    server {
        listen     3143 ssl;
        proxy_pass 127.0.0.1:5191;
    }

    # Тот же OSCAR для современных клиентов (Miranda NG и подобных):
    # сертификат Tailscale от Let's Encrypt, который проверяется штатно,
    # без установки чего-либо в системное хранилище.
    server {
        listen                5193 ssl;
        ssl_certificate       /etc/nginx/certs/ts-cert.pem;
        ssl_certificate_key   /etc/nginx/certs/ts-key.pem;
        proxy_pass            127.0.0.1:5191;
    }
}
