# HTTPS front of the registration and profile pages (oscar-register).
#
# Mounted into the nginx container by deploy/docker-compose.yaml. People open
# these pages in an ordinary browser, so this is the one front that needs
# nothing old: the public Let's Encrypt certificate and TLS 1.2 only.

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/ts-cert.pem;
    ssl_certificate_key /etc/nginx/certs/ts-key.pem;
    # OpenSSL 1.0.2 predates TLS 1.3.
    ssl_protocols       TLSv1.2;

    # A picture or a long profile is still small.
    client_max_body_size 4m;

    # The admin panel (oscar-admin), behind its own password (HTTP Basic, so
    # over HTTPS only). It listens on the machine only; this is its one way in
    # from outside. Its page calls its API by relative paths, so it works under
    # /admin/ as it does at the root through an SSH tunnel.
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8099;
        # Setting any header here drops the inherited ones, so all are listed.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
